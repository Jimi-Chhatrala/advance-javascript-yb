      const promiseToFullfill = (dataToReturn, messageToLog, isFulfilled) => {
        return function (resolve, reject) {
          setTimeout(() => {
            if (isFulfilled) {
              console.log(`The ${messageToLog} promise has resolved.`);
              resolve(dataToReturn);
            } else {
              console.log(`The ${messageToLog} promise has rejected.`);
              reject(dataToReturn);
            }
          }, dataToReturn * 100);
        };
      };

      const promise4 = new Promise(promiseToFullfill(10, 'First', true));
      const promise5 = new Promise(promiseToFullfill(20, 'Second', false));
      const promise6 = new Promise(promiseToFullfill(30, 'Third', true));

      let total = 0;
      // Promise.all([promise1, promise2, promise3])
      Promise.all([promise4, promise5, promise6])
        .then((result) => {
          for (const value in result) total += result[value];
          console.log('Result:', result);
          console.log('Total:', total);
        })
        .catch((error) => {
          console.log('Error:', error);
        });
    </script>
