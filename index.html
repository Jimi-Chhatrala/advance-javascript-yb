<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spread operator</title>
  </head>
  <body>
    <script>
      function sum(name, course, ...args) {
        console.log('arguments:', arguments);
        console.log('args:', args);

        document.write(`${name} from ${course} with sum: `);

        let sum = 0;
        for (let index in args) {
          sum += args[index];
        }

        document.write(sum + '<br>');
      }
      sum('John', 'BA', 10, 20);
      sum('Doe', 'MBA', ...[10, 20, 30]);

      // Example 2
      const arr1 = [1, 2, 3];
      console.log('[...arr1]:', [...arr1]);

      // Example 3
      const arr2 = [11, 12, 13];
      const arr3 = arr2;
      arr2.push(14);
      console.log('arr2:', arr2);
      console.log('arr3:', arr3);

      // Example 4
      const arr4 = [9, 8, 7];
      const arr5 = [...arr4];
      arr4.push(6);
      console.log('arr4:', arr4);
      console.log('arr5:', arr5);

      // Example 5
      const arr6 = [99, 88, 77];
      const arr7 = [66, 55];
      const arr8 = arr6.concat(arr7);
      console.log('arr8:', arr8);

      // Example 6
      const arr9 = [99, 88, 77];
      const arr10 = [66, 55];
      const arr11 = [5, ...arr9, ...arr10, 65];
      console.log('arr11:', arr11);

      // Example 7
      const obj1 = {
        name: 'John Doe',
        course: 'MBA',
      };
      const obj2 = {
        year: 2026,
      };
      const obj3 = {
        ...obj1,
        ...obj2,
      };
      console.log('obj3:', obj3);
    </script>
  </body>
</html>
