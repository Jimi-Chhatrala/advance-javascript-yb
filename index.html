<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template strings</title>
  </head>
  <body>
    <script>
      let user = 'John Doe';
      document.write('Hello ' + user + ' welcome to 2026.');

      let marks = 350;
      let hello = `Hello "${user}",
         
        your 'marks' is ${marks}.`;
      document.write(hello);
      console.log('hello template string: ', hello);

      const firstName = 'Java';
      const lastName = 'Script';

      function funFullName(firstName, lastName) {
        return `${firstName} ${lastName}`;
      }

      const fullName = `Hello ${funFullName(firstName, lastName)}`;
      document.write(fullName);
      console.log('Full Name:', fullName);
    </script>
  </body>
</html>
